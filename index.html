<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMITY Clan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;800&display=swap');
        
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #0f1115;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            /* ลบสีไฮไลท์สีฟ้าเวลาแตะบนมือถือ */
            -webkit-tap-highlight-color: transparent;
        }

        .clan-name {
            background: linear-gradient(to bottom, #fde047 0%, #ca8a04 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* เอฟเฟกต์การแสดงผลสำหรับปุ่ม */
        .square-tile {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 15px rgba(202, 138, 4, 0.1);
            aspect-ratio: 1 / 1;
            outline: none;
        }

        /* เอฟเฟกต์ Hover เฉพาะอุปกรณ์ที่มีเมาส์ (เพื่อไม่ให้ค้างบนมือถือ) */
        @media (hover: hover) {
            .square-tile:hover {
                box-shadow: 0 0 30px rgba(234, 179, 8, 0.3);
                transform: scale(1.05);
                border-color: rgba(234, 179, 8, 0.5);
                background-color: #1a1e26;
            }
        }

        /* เอฟเฟกต์ขณะกำลังกด (Active) */
        .square-tile:active {
            background-color: #ca8a04 !important;
            color: #000 !important;
            transform: scale(0.95);
            transition: all 0.1s;
        }
    </style>
</head>
<body>

    <div class="text-center px-4 py-10 w-full max-w-6xl">
        <!-- Clan Name -->
        <h1 class="text-7xl md:text-9xl font-black tracking-tighter mb-16 clan-name">
            AMITY
        </h1>

        <!-- Square Icon Menu -->
        <div class="flex flex-wrap justify-center gap-6 md:gap-10">
            <!-- Weekly Donation Button -->
            <a href="https://amity-ce.github.io/user/" 
               target="_blank" 
               class="square-tile w-40 h-40 md:w-56 md:h-56 flex flex-col items-center justify-center gap-4 bg-[#161920] border-2 border-yellow-900/30 text-yellow-500 rounded-3xl group">
                
                <div class="p-3 md:p-4 bg-yellow-500/10 rounded-2xl group-active:bg-black/10 transition-colors">
                    <i data-lucide="coins" class="w-10 h-10 md:w-16 md:h-16"></i>
                </div>
                
                <span class="text-base md:text-xl font-bold uppercase tracking-wide leading-tight">
                    WEEKLY GOLD<br>DONATION
                </span>
            </a>

            <!-- BOSS TRACKER Button -->
            <a href="https://amity-ce.github.io/test/" 
               target="_blank" 
               class="square-tile w-40 h-40 md:w-56 md:h-56 flex flex-col items-center justify-center gap-4 bg-[#161920] border-2 border-yellow-900/30 text-yellow-500 rounded-3xl group">
                
                <div class="p-3 md:p-4 bg-yellow-500/10 rounded-2xl group-active:bg-black/10 transition-colors">
                    <i data-lucide="skull" class="w-10 h-10 md:w-16 md:h-16"></i>
                </div>
                
                <span class="text-base md:text-xl font-bold uppercase tracking-wide leading-tight">
                    BOSS<br>TRACKER
                </span>
            </a>

            <!-- Calculate Button -->
            <a href="https://amity-ce.github.io/calculate/" 
               target="_blank" 
               class="square-tile w-40 h-40 md:w-56 md:h-56 flex flex-col items-center justify-center gap-4 bg-[#161920] border-2 border-yellow-900/30 text-yellow-500 rounded-3xl group">
                
                <div class="p-3 md:p-4 bg-yellow-500/10 rounded-2xl group-active:bg-black/10 transition-colors">
                    <i data-lucide="calculator" class="w-10 h-10 md:w-16 md:h-16"></i>
                </div>
                
                <span class="text-base md:text-xl font-bold uppercase tracking-wide leading-tight">
                    CALCULATE
                </span>
            </a>
        </div>
        
        <p class="text-yellow-600/30 text-xs uppercase tracking-[0.5em] font-medium mt-16">
            Official Clan Portal
        </p>
    </div>

    <script>
        // Initialize Icons
        lucide.createIcons();
    </script>
</body>
</html>
